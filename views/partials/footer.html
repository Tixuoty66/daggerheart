<footer>

  <div style="display: flex; flex-direction: row; gap: 0.8rem;  align-items: center; margin-bottom: 0.4rem;">
    {% if token %}
    <a href="{{token|resolvePath}}" target="_blank"><img style="height: 100%; max-height: 50px;" src="{{token|resolvePath}}" /></a>
    {% endif %}

    <div>
{% markdown -%}
{% if sourceFormatted %}**{{'Common.Source'|l}}:** {{sourceFormatted}}{% endif %}
**{{'Common.Location'|l}}:** {{locationFormatted|default: 'System'}}
{% endmarkdown %}
    </div>
  </div>

  {% if tags %}
  <div class="tags">
  {% for tag in tags %}
    <span class="tag">{{tag}}</span>
  {% endfor %}
  </div>
  {% endif %}
</footer>
