<!doctype html>
<html lang="en" data-entity-id="{{id}}" data-kind="{{kind}}" {% if type %} data-type="{{type}}"{% endif %}{% if env.theme %} data-view-theme="{{env.theme}}"{% endif %}>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}}</title>
  <link href="{{env.systemURL|default: '/'}}styles/pico.min.css" rel="stylesheet" type="text/css">
  <link href="{{env.systemURL|default: '/'}}styles/default.css" rel="stylesheet" type="text/css">
  {% if env.theme %}<link href="{{ env.systemURL }}styles/themes/{{ env.theme }}.css" rel="stylesheet" type="text/css">{% endif %}
  {% for href in env.styles %}<link href="{{ href }}" rel="stylesheet" type="text/css">{% endfor %}
</head>

<body>
  {% block content %}{% endblock %}
  
  {% block scripts %}{% endblock %}
  {% for src in env.scripts %}<script src="{{ src }}"></script>{% endfor %}
</body>
</html>
