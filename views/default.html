{% extends "base.html" %}
{% block content %}
<main id="default" class="container-fluid">

  <h1 class="title">{{name}}</h1>

  {% if descr %}
  {{descr|md}}
  {% endif %}

  {% if notes %}
  <h3>{{'Common.Notes'|l}}</h3>
  {{notes|md}}
  {% endif %}

  {% if image %}
  <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
    <a href="{{image|resolvePath}}" target="_blank"><img style="height: 100%; max-height: 512px;" src="{{image|resolvePath}}" /></a>
  </div>
  {% endif %}

  {% include "footer.html" %}
</main>
{% endblock %}
